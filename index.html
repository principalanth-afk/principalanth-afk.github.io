/* ---- excel ---- */
async function exportarExcel() {
  brindis('Armando el archivo...');
  let todasVentas = [], todosMovs = [];
  for (const m of S.meses) {
    const d = await cargarMes(m);
    todasVentas = todasVentas.concat(d.ventas);
    todosMovs = todosMovs.concat(d.movs);
  }
  // asegura que el día de hoy tenga resumen aunque no se haya cerrado
  const fechas = Array.from(new Set(todasVentas.map(v => v.fecha))).sort();
  const resumen = [['Fecha', 'BCV', 'Proyección', 'Tasa de venta', 'USDT', 'Descuento %', 'Ventas', 'Unidades',
    'Venta lista $', 'Descuentos $', 'Entró $', 'Costo $', 'Ganancia nominal $', 'Ganancia real $', 'Margen %',
    'Punto de venta Bs', 'Efectivo Bs', 'Pago móvil Bs', 'Efectivo divisas $', 'Binance $',
    'Total Bs', 'Total divisas $']];
  fechas.forEach(f => {
    const r = resumenDia(f, todasVentas);
    const t = S.tasas.find(x => x.fecha === f) || {};
    resumen.push([f, nz(t.bcv), nz(t.proyeccion), nz(t.tasaVenta), nz(t.usdt), nz(t.descuentoPct),
      r.nVentas, r.unidades, r.ventaLista, r.descuentos, r.ingresoReal, r.costo,
      r.gananciaNominal, r.gananciaReal, r.margen,
      r.cobros.punto, r.cobros.efectivo_bs, r.cobros.pago_movil,
      r.cobros.efectivo_usd, r.cobros.binance,
      r.ventaBs, r.ventaUsd]);
  });

  // hoja nueva: una fila por venta con cómo entró la plata
  const cobros = [['Fecha', 'Hora', 'Quién', 'Venta', 'Forma de pago',
    'Método en bolívares', 'Monto Bs', 'Método en divisa', 'Monto $',
    'Total en divisa $', 'Costo $', 'Ganancia real $', 'Anulada']];
  todasVentas.forEach(v => {
    const mBs = v.metodoBs || (['efectivo_usd', 'binance', 'mixto'].indexOf(v.metodo) < 0 ? v.metodo : null);
    const mUsd = v.metodoUsd || (['efectivo_usd', 'binance'].indexOf(v.metodo) >= 0 ? v.metodo : null);
    cobros.push([v.fecha, hora(v.ts), v.usuario, v.id,
      v.metodo === 'mixto' ? 'Combinado' : nombreMetodo(v.metodo),
      mBs ? nombreMetodo(mBs) : '', nz(v.cobradoBs),
      mUsd ? nombreMetodo(mUsd) : '', nz(v.cobradoUsd),
      nz(v.ingresoReal), nz(v.costoTotal), nz(v.gananciaReal), v.anulada ? 'sí' : 'no']);
  });

  const detalle = [['Fecha', 'Hora', 'Quién', 'Venta', 'Producto', 'Presentación', 'Cantidad', 'Unidades',
    'Costo unit $', 'Precio lista $', 'Precio Bs', 'Precio efectivo $', 'Subtotal $', 'Ganancia $', 'Pago', 'Anulada']];
  todasVentas.forEach(v => v.items.forEach(it => {
    detalle.push([v.fecha, hora(v.ts), v.usuario, v.id, it.nombre, it.presNombre, it.cant, it.unidades,
      it.costoUnit, it.precioLista, it.precioBs, it.precioEfectivo, it.subtotalLista, it.gananciaLinea,
      v.metodo === 'mixto' ? 'Combinado' : nombreMetodo(v.metodo), v.anulada ? 'sí' : 'no']);
  }));

  const inventario = [['Código', 'Producto', 'Presentación', 'Categoría', 'Stock', 'Costo $', 'Precio $',
    'Valor costo $', 'Valor venta $', 'Margen %', 'Última venta']];
  S.productos.forEach(p => {
    const cod = (p.pres.find(x => x.factor === 1) || p.pres[0] || {}).codigo || '';
    inventario.push([cod, p.nombre, p.presentacion || '', p.categoria || '', nz(p.stock), nz(p.costo), nz(p.precio),
      nz(p.stock) * nz(p.costo), nz(p.stock) * nz(p.precio),
      p.precio > 0 ? ((p.precio - p.costo) / p.precio) * 100 : 0, p.ultimaVenta || '']);
  });

  const movs = [['Fecha', 'Hora', 'Quién', 'Producto', 'Tipo', 'Unidades', 'Costo unit $', 'Nota']];
  todosMovs.forEach(m => {
    const p = producto(m.productoId);
    movs.push([m.fecha, hora(m.ts), m.usuario, p ? p.nombre : m.productoId, m.tipo, m.unidades, m.costo, m.nota || '']);
  });

  const tasas = [['Fecha', 'BCV', 'USDT', 'Promedio 3 días', 'Proyección', 'Tasa de venta', 'Descuento %', 'Brecha %', 'Origen']];
  S.tasas.forEach(t => tasas.push([t.fecha, t.bcv, t.usdt, t.promedio3d, t.proyeccion, t.tasaVenta, t.descuentoPct,
    t.usdt > 0 ? (1 - t.bcv / t.usdt) * 100 : 0, t.origen]));

  const hojas = [
    { nombre: 'Resumen_Diario', columnas: [11, 10, 11, 13, 10, 11, 8, 9, 13, 12, 11, 10, 17, 15, 10, 16, 13, 15, 17, 12, 13, 16], filas: resumen },
    { nombre: 'Cobros_Por_Venta', columnas: [11, 7, 10, 14, 14, 24, 13, 20, 11, 15, 10, 14, 9], filas: cobros },
    { nombre: 'Ventas_Detalle', columnas: [11, 7, 10, 12, 26, 13, 9, 9, 11, 13, 12, 15, 11, 11, 14, 9], filas: detalle },
    { nombre: 'Inventario', columnas: [16, 26, 13, 12, 8, 9, 9, 12, 12, 9, 12], filas: inventario },
    { nombre: 'Movimientos', columnas: [11, 7, 10, 26, 12, 9, 11, 24], filas: movs },
    { nombre: 'Tasas', columnas: [11, 10, 10, 14, 11, 13, 11, 10, 9], filas: tasas }
  ];
  const bytes = construirXLSX(hojas);
  const nombre = 'CAVA_' + S.config.negocio.replace(/[^a-zA-Z0-9]/g, '_') + '_' + hoyISO() + '.xlsx';
  descargar(nombre, new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  brindis('Excel listo, revisa tus descargas');
}

/* ====================== tasas ====================== */
function renderTasas() {
  const hoy = hoyISO();
  const t = tasaDe(hoy);
  const vig = tasaVigente();
  let h = '<h2>Tasas del día</h2>';

  if (!t) h += '<div class="aviso-caja mal">Todavía no has cargado la tasa de hoy.</div>';

  h += '<button class="btn oro" onclick="bajarAuto()">Bajar tasas de internet</button>' +
    '<p class="nota">Toma el BCV y el paralelo de ve.dolarapi.com. Si no hay internet, métela a mano abajo.</p>';

  h += '<div class="tarjeta" style="margin-top:14px">' +
    '<label>BCV de hoy (Bs por dólar)</label><input id="tbcv" type="number" step="0.0001" value="' + (t ? t.bcv : (vig ? vig.bcv : '')) + '" oninput="previaTasa()">' +
    '<label>USDT Binance de hoy (Bs por dólar)</label><input id="tusdt" type="number" step="0.0001" value="' + (t ? t.usdt : (vig ? vig.usdt : '')) + '" oninput="previaTasa()">' +
    '<div id="tprev" style="margin-top:12px"></div>' +
    '<button class="btn verde" style="margin-top:12px" onclick="guardarTasaManual()">Guardar la tasa de hoy</button>' +
    '</div>';

  if (S.tasas.length) {
    const ult = S.tasas.slice(-15);
    const min = Math.min.apply(null, ult.map(x => x.bcv));
    const max = Math.max.apply(null, ult.map(x => x.bcv));
    const rango = (max - min) || 1;
    h += '<h3>Cómo viene subiendo el BCV</h3>' +
      '<div class="grafico">' + ult.map(x =>
        '<div style="height:' + (12 + ((x.bcv - min) / rango) * 58) + 'px" title="' + x.fecha + ': ' + fmtNum(x.bcv, 2) + '"></div>').join('') + '</div>' +
      '<p class="nota">' + fmtNum(min, 2) + ' → ' + fmtNum(max, 2) + ' Bs en los últimos ' + ult.length + ' registros</p>';

    h += '<h3>Historial</h3><div class="lista">' + S.tasas.slice().reverse().slice(0, 30).map(x =>
      '<div class="item"><div class="cuerpo"><div class="tit">' + fechaLarga(x.fecha) + '</div>' +
      '<div class="sub">BCV ' + fmtNum(x.bcv, 2) + ' · venta ' + fmtNum(x.tasaVenta, 2) + ' · ' + esc(x.origen || 'manual') + '</div></div>' +
      '<div class="der"><b class="num">' + fmtNum(x.descuentoPct, 1) + '%</b><span>USDT ' + fmtNum(x.usdt, 0) + '</span></div></div>'
    ).join('') + '</div>';
  }
  h += '<button class="btn chico" style="margin-top:14px" onclick="irA(\'ajustes\')">Cambiar cómo se calcula</button>';
  $('#v-tasas').innerHTML = h;
  previaTasa();
}

function previaTasa() {
  const bcv = parseFloat($('#tbcv').value) || 0;
  const usdt = parseFloat($('#tusdt').value) || 0;
  const d = $('#tprev');
  if (!bcv || !usdt) { d.innerHTML = '<p class="nota">Mete las dos tasas para ver el cálculo.</p>'; return; }
  const t = calcularTasa(hoyISO(), bcv, usdt, 'manual');
  const brecha = (1 - bcv / usdt) * 100;
  d.innerHTML = '<table class="mini">' +
    '<tr><td>Sube en promedio (últimos 3 días)</td><td class="num">' + fmtNum(t.promedio3d, 2) + ' Bs/día</td></tr>' +
    '<tr><td>Proyección a ' + S.config.diasCobertura + ' día' + (S.config.diasCobertura > 1 ? 's' : '') + (t.topado ? ' (topada)' : '') + '</td><td class="num">+' + fmtNum(t.proyeccion, 2) + ' Bs</td></tr>' +
    '<tr><td><b>Tasa a la que vendes</b></td><td class="num">' + fmtNum(t.tasaVenta, 2) + '</td></tr>' +
    '<tr><td>Brecha BCV contra USDT</td><td class="num">' + fmtNum(brecha, 2) + '%</td></tr>' +
    '<tr><td><b>Descuento en divisa</b></td><td class="num">' + fmtNum(t.descuentoPct, 2) + '%</td></tr>' +
    '</table>' +
    '<div class="aviso-caja" style="margin-top:10px">Algo de <b>$10</b> se vende a <b class="num">' +
    fmtBs(redondear(10 * t.tasaVenta, S.config.redondeoBs)) + ' Bs</b> o <b class="num">$' +
    fmtUsd(redondear(10 * (1 - t.descuentoPct / 100), 0.01)) + '</b> en efectivo.</div>' +
    (t.refFecha ? '<p class="nota">Comparado contra el BCV del ' + t.refFecha + ' (' + fmtNum(t.refBcv, 2) + ').</p>'
      : '<p class="nota">Todavía no hay 3 días de historia, así que la proyección va en cero. Se corrige sola.</p>');
}

function guardarTasaManual() {
  const bcv = parseFloat($('#tbcv').value) || 0;
  const usdt = parseFloat($('#tusdt').value) || 0;
  if (!bcv || !usdt) return brindis('Faltan las tasas', true);
  guardarTasa(calcularTasa(hoyISO(), bcv, usdt, 'manual'));
  brindis('Tasa guardada'); render();
}

async function bajarAuto() {
  brindis('Buscando las tasas...');
  const r = await bajarTasas();
  if (r.error || !r.bcv) return brindis(r.error || 'No se pudo', true);
  guardarTasa(calcularTasa(hoyISO(), r.bcv, r.usdt, 'auto'));
  brindis('Tasas actualizadas'); render();
}

function cambiarModo(activo) {
  if (activo && (S.ventas.length || S.productos.length)) {
    abrirHoja('<div class="asa"></div><h4>¿Este aparato deja de vender?</h4>' +
      '<p class="nota">Se esconden Vender y Cargar. Lo que ya está guardado acá no se borra, pero deja de moverse: para verlo al día habrá que restaurar el respaldo de la caja.</p>' +
      '<button class="btn oro" style="margin-top:14px" onclick="confirmarModo(true)">Sí, solo consultar</button>' +
      '<button class="btn chico" style="margin-top:8px" onclick="cerrarHoja();render()">Mejor no</button>');
    return;
  }
  confirmarModo(activo);
}
function confirmarModo(activo) {
  S.config.soloConsulta = !!activo;
  guardar(['config']);
  cerrarHoja();
  brindis(activo ? 'Aparato en modo consulta' : 'Aparato habilitado para vender');
  irA('inicio');
}

function elegirUsuario(i) {
  const u = S.config.usuarios[i];
  if (u) { S.config.usuario = u; guardar(['config']); render(); }
}

function guardarAjustes() {
  const c = S.config;
  c.negocio = $('#cneg').value.trim() || c.negocio;
  const us = $('#cusr').value.split(',').map(s => s.trim()).filter(Boolean);
  if (us.length) { c.usuarios = us; if (us.indexOf(c.usuario) < 0) c.usuario = us[0]; }
  c.modoRecargo = $('#cmodo').value;
  c.diasCobertura = Math.max(0, parseFloat($('#ccob').value) || 0);
  c.topeProyeccionPct = Math.max(0, parseFloat($('#ctop').value) || 0);
  c.topeDescuentoPct = Math.max(0, parseFloat($('#ctd').value) || 0);
  c.pisoDescuentoPct = Math.max(0, parseFloat($('#cpd').value) || 0);
  c.redondeoBs = Math.max(0, parseFloat($('#crb').value) || 0);
  c.redondeoUsd = Math.max(0, parseFloat($('#cru').value) || 0);
  c.igtf = $('#cigtf').checked;
  if ($('#ccons')) c.soloConsulta = $('#ccons').checked;
  // recalcula la tasa de hoy con los parámetros nuevos
  const t = tasaDe(hoyISO());
  if (t) guardarTasa(calcularTasa(hoyISO(), t.bcv, t.usdt, t.origen));
  guardar(['config']);
  brindis('Ajustes guardados'); render();
}

async function bajarRespaldo() {
  const datos = { version: 1, fecha: ahora(), config: S.config, productos: S.productos, tasas: S.tasas, cierres: S.cierres, meses: S.meses, ventas: {}, movs: {} };
  for (const m of S.meses) {
    const d = await cargarMes(m);
    datos.ventas[m] = d.ventas; datos.movs[m] = d.movs;
  }
  descargar('respaldo_cava_' + hoyISO() + '.json', JSON.stringify(datos), 'application/json');
  brindis('Respaldo bajado');
}

function pedirRestaurar() {
  abrirHoja('<div class="asa"></div><h4>Restaurar respaldo</h4>' +
    '<p class="nota">Reemplaza todo lo que hay ahora por lo que traiga el archivo.</p>' +
    '<input type="file" id="arch" accept=".json" style="margin-top:14px">' +
    '<button class="btn rojo" style="margin-top:14px" onclick="hacerRestaurar()">Restaurar</button>');
}
function hacerRestaurar() {
  const f = $('#arch').files[0];
  if (!f) return brindis('Elige el archivo', true);
  const r = new FileReader();
  r.onload = async () => {
    try {
      const d = JSON.parse(r.result);
      S.config = Object.assign({}, CFG_DEF, d.config || {});
      S.productos = d.productos || []; S.tasas = d.tasas || [];
      S.cierres = d.cierres || []; S.meses = d.meses || [];
      for (const m of Object.keys(d.ventas || {})) await DB.set('ventas_' + m, d.ventas[m]);
      for (const m of Object.keys(d.movs || {})) await DB.set('movs_' + m, d.movs[m]);
      const mm = mesDe(hoyISO());
      S.mesCargado = mm;
      S.ventas = (d.ventas || {})[mm] || []; S.movs = (d.movs || {})[mm] || [];
      if (S.meses.indexOf(mm) < 0) S.meses.push(mm);
      reindexar(); await DB.set('iniciado', true); await guardarYa();
      cerrarHoja(); brindis('Restaurado'); render();
    } catch (e) { brindis('El archivo no sirve', true); }
  };
  r.readAsText(f);
}

function pedirBorrarTodo() {
  abrirHoja('<div class="asa"></div><h4>¿Borrar todo?</h4>' +
    '<p class="nota">Se van los productos, las ventas y el historial. No hay vuelta atrás. Baja un respaldo antes si tienes dudas.</p>' +

    '<button class="btn rojo" style="margin-top:8px" onclick="hacerBorrarTodo()">Sí, borrar todo</button>');
}

}

/* ====================== arranque ====================== */
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function arrancar() {
  await cargarEstado();
  const yaArrancado = await DB.get('iniciado');
  if (!yaArrancado) {
    if (!S.productos.length && !S.tasas.length) await sembrarEjemplo();
    await DB.set('iniciado', true);
  }
  irA(S.tasas.length ? 'inicio' : 'tasas');
  if (S.config.autoTasas && !tasaDe(hoyISO())) {
    const r = await bajarTasas();
    if (!r.error && r.bcv) { guardarTasa(calcularTasa(hoyISO(), r.bcv, r.usdt, 'auto')); render(); }
  }
}

async function sembrarEjemplo() {
  const demo = [
    ['Cerveza Polar Pilsen', 'lata 269 cc', 'Cerveza', 0.62, 0.90, 96, 24, true, 24],
    ['Cerveza Solera Verde', 'lata 269 cc', 'Cerveza', 0.68, 1.00, 48, 24, true, 24],
    ['Ron Cacique 500 Añejo', '750 ml', 'Ron', 6.10, 9.50, 12, 3, true, 12],
    ['Ron Santa Teresa 1796', '750 ml', 'Ron', 21.00, 31.00, 4, 2, false, 6],
    ['Whisky Old Parr', '750 ml', 'Whisky', 26.00, 38.00, 3, 2, false, 6],
    ['Vodka Absolut', '750 ml', 'Vodka', 14.50, 22.00, 5, 2, false, 6],
    ['Ponche Crema', '750 ml', 'Licor', 5.20, 8.00, 8, 3, false, 12],
    ['Agua Minalba', '600 ml', 'Bebidas', 0.35, 0.70, 40, 12, true, 24],
    ['Hielo', 'bolsa 2 kg', 'Otros', 0.60, 1.25, 20, 6, true, 1],
    ['Cigarrillos Belmont', 'cajetilla', 'Cigarrillos', 1.40, 1.90, 25, 10, true, 10]
  ];
  S.productos = demo.map((d, i) => {
    const pres = [{ nombre: 'Unidad', factor: 1, codigo: 'DEMO' + pad(i + 1), precio: null }];
    if (d[8] > 1) pres.push({ nombre: 'Caja de ' + d[8], factor: d[8], codigo: 'DEMOC' + pad(i + 1), precio: null });
    return {
      id: uid(), nombre: d[0], presentacion: d[1], categoria: d[2], costo: d[3], precio: d[4],
      stock: d[5], minimo: d[6], favorito: d[7], aplicaDesc: true, activo: true, pres,
      creado: ahora(), creadoFecha: hoyISO(), actualizado: ahora(), demo: true
    };
  });
  reindexar();
  guardar(['productos']);
}
