<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>Sin Límites</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#070b16; --bg2:#0b1122; --card:#101829; --card2:#152038; --line:#22304f; --line2:#2d3d62;
  --text:#e9eef8; --muted:#8e9bb8; --dim:#5e6b88;
  --gold:#f5b841; --gold2:#ffd27a; --cyan:#3fd0ff; --win:#35d49a; --loss:#ff5d6c; --prot:#f5b841;
  --r:18px; --nav:68px;
  --sat: env(safe-area-inset-top,0px); --sab: env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(var(--nav) + var(--sab) + 10px)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:.02em}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .dim{color:var(--dim)} .gold{color:var(--gold)} .cyan{color:var(--cyan)} .win{color:var(--win)} .loss{color:var(--loss)}
.num{font-variant-numeric:tabular-nums}
.caps{text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:700;color:var(--muted)}

/* Barra superior */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 70%,transparent);padding:calc(10px + var(--sat)) 0 8px}
.top .wrap{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;flex:none}
.brand{font-weight:900;letter-spacing:.2em;font-size:15px}
.brand small{display:block;font-size:10px;letter-spacing:.18em;color:var(--muted);font-weight:600}
.top .dia{margin-left:auto;font-size:12px;color:var(--gold);border:1px solid var(--line2);padding:4px 10px;border-radius:99px;font-weight:700}

/* Tarjetas */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:800}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* Portada con ilustración que "se enfoca" */
.hero{position:relative;border-radius:var(--r);overflow:hidden;margin:6px 0 12px;border:1px solid var(--line);aspect-ratio:400/240;background:#0a1024;cursor:pointer}
.hero svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero .art{position:absolute;inset:0;animation:enfocar 2.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes enfocar{0%{filter:blur(7px) grayscale(1) brightness(.55);transform:scale(1.06)}55%{filter:blur(1.5px) grayscale(.4) brightness(.85)}100%{filter:none;transform:none}}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,22,0) 30%,rgba(7,11,22,.92) 100%)}
.hero .txt{position:absolute;left:16px;right:16px;bottom:12px}
.hero .pil{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.2em;color:#1b1406;background:var(--gold);padding:3px 8px;border-radius:99px}
.hero .msg{font-size:17px;font-weight:700;line-height:1.3;margin-top:6px;text-shadow:0 2px 12px rgba(0,0,0,.6);animation:aparecer .9s .6s both}
@keyframes aparecer{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero .tap{position:absolute;top:10px;right:12px;font-size:11px;color:#fff;opacity:.6}

/* Capital */
.cap{display:flex;gap:16px;align-items:center}
.ring{width:108px;height:108px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .in b{font-size:22px;display:block;line-height:1}
.ring .in span{font-size:10px;color:var(--muted);letter-spacing:.1em}
.big{font-size:34px;font-weight:900;line-height:1.05;letter-spacing:-.01em}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));border-radius:99px}

/* Barra de avance a la meta */
.mb{margin-top:14px}
.mb-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.mb-head b{font-size:22px;font-weight:900;color:var(--gold)}
.mb-track{position:relative;height:18px;border-radius:99px;background:var(--card2);border:1px solid var(--line2)}
.mb-fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:width 1.2s cubic-bezier(.2,.8,.2,1);min-width:0}
.mb-tick{position:absolute;top:3px;bottom:3px;width:2px;background:rgba(233,238,248,.18);border-radius:2px}
.mb-dot{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:var(--bg);border:3px solid var(--gold);transform:translate(-50%,-50%);box-shadow:0 0 14px rgba(245,184,65,.6);transition:left 1.2s cubic-bezier(.2,.8,.2,1)}
.mb-lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:8px;font-weight:700}
.mb-lab span:nth-child(2),.mb-lab span:nth-child(3),.mb-lab span:nth-child(4){opacity:.7}
.topbar{height:4px;background:var(--card2);border-radius:99px;margin:8px 16px 0;overflow:hidden;max-width:528px}
@media (min-width:560px){.topbar{margin:8px auto 0}}
.topbar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));border-radius:99px;transition:width 1s}
.mov-it .dn{font-size:20px}
.dn.imp{background:rgba(255,93,108,.15);color:var(--loss)} .dn.apo{background:rgba(63,208,255,.14);color:var(--cyan)}
.badge.imp{background:rgba(255,93,108,.15);color:var(--loss)} .badge.apo{background:rgba(63,208,255,.14);color:var(--cyan)}
.leg .cobra{font-size:12px;margin-top:6px;color:var(--muted);border-top:1px dashed var(--line2);padding-top:6px}
.leg .tag{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;font-weight:900;font-size:15px;margin-right:6px;vertical-align:middle}
.leg.r .tag{background:var(--cyan);color:#04121a} .leg.p .tag{background:var(--gold);color:#1b1406}
.leg.vacia b{color:var(--dim)!important}
.res.tres{grid-template-columns:1fr}
.res.tres .rbtn{justify-content:flex-start;padding:14px 16px;font-size:15px;white-space:nowrap}
.res.tres .rbtn small{margin-left:auto;font-weight:600;color:var(--dim);font-size:12px}
.oblig{color:var(--loss);font-weight:800}

/* Días que faltan */
.tile{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.tile b{display:block;font-size:26px;font-weight:900;line-height:1.1}
.tile .l{font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.tile .f{font-size:11px;color:var(--dim);margin-top:2px}
.tile.main{border-color:var(--gold);background:linear-gradient(180deg,rgba(245,184,65,.12),rgba(245,184,65,.02))}
.tile.main b{color:var(--gold)}
.faltan-frase{margin-top:10px;font-size:14px}

/* Formularios */
label.f{display:block;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;margin:0 0 6px}
.inp{width:100%;background:var(--bg2);border:1.5px solid var(--line2);border-radius:12px;padding:12px 12px;font-size:18px;font-weight:700;outline:none}
.inp:focus{border-color:var(--cyan)}
.inp.sm{font-size:15px;padding:10px}
.pre{position:relative}.pre .inp{padding-left:28px}.pre::before{content:"$";position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700}
.hint{font-size:12px;color:var(--dim);margin-top:5px}

/* Reparto de la apuesta */
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.leg{border-radius:14px;padding:12px;border:1.5px solid}
.leg.r{border-color:rgba(63,208,255,.5);background:rgba(63,208,255,.07)}
.leg.p{border-color:rgba(245,184,65,.5);background:rgba(245,184,65,.07)}
.leg .caps{font-size:10px}
.leg b{display:block;font-size:26px;font-weight:900;margin-top:2px}
.leg.r b{color:var(--cyan)} .leg.p b{color:var(--gold)}
.escen{margin-top:12px;border-top:1px dashed var(--line2);padding-top:10px}
.escen .row{justify-content:space-between;padding:4px 0;font-size:14px}

/* Resultado (botones) */
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rbtn{background:var(--bg2);border:1.5px solid var(--line2);border-radius:14px;padding:12px 8px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;justify-content:center}
.rbtn .ic{width:20px;height:20px}
.rbtn.on.ganan{border-color:var(--win);background:rgba(53,212,154,.14);color:var(--win)}
.rbtn.on.prot{border-color:var(--prot);background:rgba(245,184,65,.14);color:var(--gold)}
.rbtn.on.pierden{border-color:var(--loss);background:rgba(255,93,108,.14);color:var(--loss)}
.rbtn.on.noaposte{border-color:var(--muted);background:rgba(142,155,184,.14)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:15px;font-weight:900;font-size:16px;letter-spacing:.04em;cursor:pointer;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#1b1406}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sec{background:var(--card2);color:var(--text);border:1.5px solid var(--line2);font-weight:800}
.btn.dang{background:transparent;color:var(--loss);border:1.5px solid rgba(255,93,108,.5)}
.btn.sm{padding:10px;font-size:14px}
.lnk{background:none;border:0;color:var(--cyan);font-weight:700;cursor:pointer;padding:0;font-size:13px}

.aviso{border-radius:14px;padding:12px 14px;font-size:13.5px;margin:10px 0;display:flex;gap:10px;align-items:flex-start;border:1px solid}
.aviso.warn{background:rgba(245,184,65,.1);border-color:rgba(245,184,65,.45)}
.aviso.bad{background:rgba(255,93,108,.1);border-color:rgba(255,93,108,.5)}
.aviso.ok{background:rgba(53,212,154,.08);border-color:rgba(53,212,154,.4)}
.aviso.info{background:rgba(63,208,255,.07);border-color:rgba(63,208,255,.35)}
.aviso b.t{display:block}

/* Chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line2);background:var(--bg2);border-radius:99px;padding:8px 14px;font-weight:800;cursor:pointer}
.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(245,184,65,.1)}

/* Registro */
.dia-it{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.dia-it:last-child{border-bottom:0}
.dn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:900;background:var(--card2);font-size:14px}
.badge{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:99px;letter-spacing:.04em}
.badge.ganan{background:rgba(53,212,154,.15);color:var(--win)}
.badge.prot{background:rgba(245,184,65,.15);color:var(--gold)}
.badge.pierden{background:rgba(255,93,108,.15);color:var(--loss)}
.badge.noaposte{background:rgba(142,155,184,.15);color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.stat{background:var(--card2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:900}
.stat span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}

/* Disciplina */
.hab{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.hab:last-child{border-bottom:0}
.hab .ck{width:28px;height:28px;border-radius:9px;border:2px solid var(--line2);display:grid;place-items:center;flex:none;transition:.15s}
.hab.on .ck{background:var(--gold);border-color:var(--gold)}
.hab .ck svg{opacity:0;width:18px;height:18px}
.hab.on .ck svg{opacity:1}
.hab .ti{font-weight:700}
.hab.on .ti{color:var(--gold)}
.hab small{display:block;color:var(--dim);font-size:12px;font-weight:500}
.hab .hi{width:22px;height:22px;color:var(--cyan);flex:none;margin-left:auto;opacity:.8}
.pilar{border-radius:var(--r);overflow:hidden;background:var(--card);border:1px solid var(--line);margin:12px 0}
.pilar .img{aspect-ratio:400/200;position:relative;overflow:hidden}
.pilar .img svg{width:100%;height:100%;display:block}
.pilar .bd{padding:14px 16px 16px}
.pilar h3{font-size:13px;letter-spacing:.18em;color:var(--gold)}
.pilar .fr{font-size:17px;font-weight:800;margin:6px 0 6px;line-height:1.3}
.pilar ul{margin:8px 0 0;padding:0;list-style:none}
.pilar li{padding:5px 0 5px 22px;position:relative;font-size:14px}
.pilar li::before{content:"";position:absolute;left:2px;top:12px;width:10px;height:2px;background:var(--cyan)}
.regla{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.regla:last-child{border-bottom:0}
.regla .n{width:28px;height:28px;border-radius:50%;background:rgba(245,184,65,.14);color:var(--gold);display:grid;place-items:center;font-weight:900;flex:none;font-size:13px}

/* Navegación inferior */
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(9,14,28,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:var(--sab)}
nav.bot .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav)}
nav.bot button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--dim);font-size:11px;font-weight:700;letter-spacing:.04em;cursor:pointer}
nav.bot button svg{width:24px;height:24px}
nav.bot button.on{color:var(--gold)}
.view{display:none}.view.on{display:block;animation:aparecer .35s both}

/* Modales */
.ov{position:fixed;inset:0;z-index:50;background:rgba(3,5,11,.78);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg2);border:1px solid var(--line2);border-bottom:0;border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:18px 16px calc(18px + var(--sab));animation:subir .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes subir{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-size:18px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--sab) + 16px);transform:translateX(-50%);background:var(--card2);border:1px solid var(--line2);padding:10px 16px;border-radius:99px;z-index:60;font-weight:700;font-size:14px;animation:aparecer .25s both;max-width:90vw;text-align:center}

/* Asistente inicial */
.wiz{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;padding:calc(16px + var(--sat)) 0 calc(16px + var(--sab))}
.wiz .hero{aspect-ratio:400/220}
.wiz h1{font-size:26px;line-height:1.15;margin:14px 0 8px}
.wiz p{color:var(--muted);margin:0 0 16px}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0}
.dots i{width:8px;height:8px;border-radius:99px;background:var(--line2)}
.dots i.on{width:22px;background:var(--gold)}
.celebra{text-align:center}
.celebra .big{font-size:40px}
.confeti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confeti i{position:absolute;top:-10px;width:8px;height:14px;border-radius:2px;animation:caer 2.6s linear forwards}
@keyframes caer{to{transform:translateY(110vh) rotate(720deg)}}
details summary{cursor:pointer;color:var(--cyan);font-weight:700;font-size:13px;list-style:none}
details summary::-webkit-details-marker{display:none}
.sep{height:1px;background:var(--line);margin:14px 0}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
input[type=range]{width:100%;accent-color:var(--gold)}
input[type=date].inp{font-size:15px}
@media (max-width:360px){.big{font-size:28px}.tile b{font-size:22px}.leg b{font-size:22px}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <svg class="logo" viewBox="0 0 512 512"><circle cx="256" cy="256" r="190" fill="none" stroke="#3fd0ff" stroke-opacity=".35" stroke-width="16" stroke-dasharray="14 18"/><circle cx="256" cy="256" r="146" fill="none" stroke="#3fd0ff" stroke-width="22"/><circle cx="256" cy="256" r="98" fill="none" stroke="#f5b841" stroke-width="30"/><circle cx="256" cy="256" r="46" fill="#ffd27a"/></svg>
  <div class="brand">SIN LÍMITES<small>CAPITAL · DISCIPLINA · ENFOQUE</small></div>
  <div class="dia" id="topDia"></div>
</div><div class="topbar" title="Avance a la meta"><i id="topBar" style="width:0"></i></div></header>

<main class="wrap">
  <section class="view on" id="v-hoy"></section>
  <section class="view" id="v-reg"></section>
  <section class="view" id="v-dis"></section>
  <section class="view" id="v-plan"></section>
</main>

<nav class="bot"><div class="in">
  <button data-v="hoy" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>Hoy</button>
  <button data-v="reg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"/><path d="M5 16l4-5 4 3 6-8"/></svg>Registro</button>
  <button data-v="dis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.6 6.2L21 9l-5 4.4L17.5 20 12 16.6 6.5 20 8 13.4 3 9l6.4-.8z"/></svg>Disciplina</button>
  <button data-v="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Plan</button>
</div></nav>

const PILARES = [
  { id:'enfoque', t:'ENFOQUE', art:'enfoque',
    frase:'La claridad no viene en una pastilla: se construye apagando el ruido.',
    idea:'Cuando quitas las distracciones, tu mente trabaja al máximo. Una tarea a la vez, completa, sin que el teléfono te robe la atención.',
    acc:['Elige las 3 cosas más importantes del día antes de las 9 am','Trabaja 45 minutos seguidos sin redes ni notificaciones','Analiza la jugada con la cabeza fría, nunca con prisa'],
    msj:['El que ve claro no es el más inteligente: es el que quitó el ruido.','Hoy una sola misión: seguir el plan sin desviarte.','Tu atención es tu capital más caro. No la regales.','La mente enfocada ve oportunidades donde otros ven caos.'] },
  { id:'disciplina', t:'DISCIPLINA', art:'disciplina',
    frase:'La motivación te arranca. La disciplina te lleva a la meta.',
    idea:'No se trata de ganar un día grande, sino de repetir lo correcto todos los días. El interés compuesto premia al constante, no al impaciente.',
    acc:['Registra tu día aunque no hayas apostado','Respeta el % del plan, ganes o pierdas','Acuéstate y levántate a la misma hora'],
    msj:['Nadie ve tus días de disciplina, pero todos van a ver el resultado.','El % no se negocia. Ni cuando ganas, ni cuando pierdes.','Pequeño y constante le gana a grande y de vez en cuando.','El plan funciona si tú funcionas.'] },
  { id:'aseo', t:'ASEO PERSONAL', art:'aseo',
    frase:'Cuerpo limpio, mente clara. El primer triunfo del día es frente al espejo.',
    idea:'El cambio empieza por lo que tienes más cerca: tu cuerpo. Bañarte temprano, arreglarte la barba y el cabello es decirte a ti mismo que te tomas en serio.',
    acc:['Baño apenas te levantes, sin postergarlo','Barba, cabello y uñas en orden','Colonia o perfume: el detalle que te cambia el ánimo'],
    msj:['Quien se cuida por fuera empieza a ordenarse por dentro.','Arréglate como si hoy fuera el día en que todo cambia. Puede serlo.','La higiene es respeto: por ti y por los que te rodean.'] },
  { id:'orden', t:'ORDEN', art:'orden',
    frase:'Espacio en orden, decisiones en orden.',
    idea:'El desorden de afuera es ruido en la cabeza. Una cama tendida, un escritorio limpio y las cuentas al día te dejan energía para pensar en grande.',
    acc:['Tiende la cama apenas te levantes','Deja limpio tu espacio de trabajo antes de dormir','Cuentas y registros al día, sin pendientes'],
    msj:['Cuando ordenas tu cuarto, ordenas tu cabeza.','Un lugar para cada cosa y cada cosa en su lugar: también el dinero.','El orden es la disciplina que se ve.'] },
  { id:'vestir', t:'APARIENCIA Y VESTIR', art:'vestir',
    frase:'Vístete para el hombre en el que te estás convirtiendo.',
    idea:'La ropa no te hace, pero sí te anuncia. Ropa limpia, planchada y que te quede bien cambia cómo te miran y cómo te miras tú.',

    msj:['Primero te ves distinto, después actúas distinto, y al final vives distinto.','No necesitas ropa cara: necesitas ropa cuidada.','Tu postura habla antes que tú.'] },
  { id:'circulo', t:'CÍRCULO DE AMISTADES', art:'circulo',
    frase:'Tu nivel se parece al de la gente con la que pasas tu tiempo.',
    idea:'Rodéate de personas que construyen, que saben más que tú y que te empujan hacia arriba. Aléjate con respeto de quien solo te resta.',
    acc:['Habla hoy con alguien que admires o de quien aprendas','Reduce el tiempo con quien solo se queja','Aporta valor antes de pedirlo'],
    msj:['Si eres el que más sabe de tu grupo, busca otro grupo.','Las conversaciones de hoy son las oportunidades de mañana.','Cuida tu círculo como cuidas tu capital: con criterio.'] },
  { id:'apalancamiento', t:'APALANCAMIENTO', art:'apalancamiento',
    frase:'Con la palanca correcta, poca fuerza mueve mucho peso.',

// ================= Motor de cálculo (igual que el Excel) =================
// Reparto: a la protección va stake/cuotaP y a la riesgosa el resto.
// Así, si gana solo la protección, recuperas exactamente lo apostado (empate).
function split(stake, cR, cP){
  if (!(stake > 0) || !(cR > 1) || !(cP > 1)) return null;
  // la protección se redondea hacia ARRIBA al céntimo: así "solo protección" nunca da -$0.01
  const p = Math.min(stake, Math.ceil(stake / cP * 100 - 1e-9) / 100);
  return { r: r2(stake - p), p };
}
function ganancia(res, stake, sp, cR, cP){
  if (res === 'noaposte') return 0;
  if (res === 'pierden') return -stake;
  if (!sp) return 0;
  if (res === 'ganan') return r2(sp.r * (cR - 1) + sp.p * (cP - 1));
  if (res === 'prot') return r2(sp.p * (cP - 1) - sp.r);
  return 0;
}
function recalc(){
  if (!S.plan) return;
  S.movs = S.movs || [];
  const movsDe = anc => S.movs.filter(m => (m.tras || null) === anc);
  let cap = S.plan.inicial;
  const aplicar = m => { m.capAntes = r2(cap); cap = r2(Math.max(0, cap + m.monto)); m.capDesp = cap; };
  movsDe(null).forEach(aplicar);
  S.dias.forEach((d, i) => {
    d.n = i + 1;
    d.capIni = r2(cap);
    d.stake = d.res === 'noaposte' ? 0 : r2(cap * d.pct);
    const sp = split(d.stake, d.cR, d.cP);
    d.apR = sp ? sp.r : 0; d.apP = sp ? sp.p : 0;
    d.ganCalc = ganancia(d.res, d.stake, sp, d.cR, d.cP);
    const g = (typeof d.ganReal === 'number' && isFinite(d.ganReal)) ? d.ganReal : d.ganCalc;
    d.gan = g;
    d.capFin = r2(cap + g + (d.extra || 0));
    cap = d.capFin;
    movsDe(d.id).forEach(aplicar);
    d.capTras = cap;
  });
  S._cap = cap;
}
const capActual = () => { recalc(); return S._cap ?? S.plan.inicial; };
const q5 = (cR, cP) => (cP - 1) * cR / cP;              // ganancia por $1 si ganan las 2
function kelly(p, cR, cP){ const b = q5(cR, cP); if (!(b > 0)) return 0; return (p.pG * b - p.pL) / (b * (p.pG + p.pL)); }
function multTipico(p, f, cR, cP){ if (f >= 1) return 0; return Math.exp(p.pG * Math.log(1 + f * q5(cR, cP)) + p.pL * Math.log(1 - f)); }
const extraProm = () => S.dias.length ? S.dias.reduce((a, d) => a + (d.extra || 0), 0) / S.dias.length : 0;
function simDias(C, M, m, e){ if (C >= M) return 0; let n = 0; while (C < M && n < 3650){ C = C * m + e; n++; } return C >= M ? n : null; }
function proyeccion(){
  const p = S.plan, C = capActual(), M = p.meta, n = S.dias.length;
  let real = null, realMsg = '';
  if (C >= M) real = 0;
  else if (n === 0) realMsg = 'Registra tu día 1';
  else {
    const lg = S.dias.reduce((a, d) => a + (d.capIni > 0 && d.capFin > 0 ? Math.log(d.capFin / d.capIni) : 0), 0) / n;
    if (!(lg > 0) || !(C > 0)) realMsg = 'Aún no creces';
    else real = Math.ceil(Math.log(M / C) / lg - 1e-9);
  }
  const e = extraProm();
  const m = multTipico(p, p.pct, p.cR, p.cP);
  const esp = simDias(C, M, m, e);
  const mejor = simDias(C, M, 1 + p.pct * q5(p.cR, p.cP), e);
  return { real, realMsg, esp, mejor, e, m };
}
const recorrido = C => Math.max(0, Math.min(1, (C - S.plan.inicial) / (S.plan.meta - S.plan.inicial)));

      <div class="hint" style="font-size:12.5px;line-height:1.5">
      <b>A tu ritmo real:</b> si sigues creciendo igual que hasta hoy (con los ingresos extra incluidos).<br>
      <b>Según el plan:</b> el camino típico con tu stake, tus cuotas típicas y las probabilidades del plan (${pct(p.pG)} ganan las 2 · ${pct(p.pL)} pierden las 2), sumando cada día tu promedio de ingreso extra (${money(pr.e)}). Es lo esperado, no una garantía.<br>
      <b>Mejor caso:</b> si ganan las 2 todos los días. Nunca vas a llegar antes que esto.</div>
    </details>
  </div>

  <div class="card" id="jugada">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div><h2 style="margin:0">Tu jugada · día ${n+1}</h2>
      <div class="muted" style="font-size:13px;margin-top:2px">Capital para apostar <b class="num" style="color:var(--text)">${money(C)}</b></div></div>
      <div style="text-align:right"><div class="caps">Stake ${pct(p.pct)}</div><div class="big num gold" style="font-size:26px" id="jStake"></div></div>
    </div>
    <div class="grid2" style="margin-top:12px">
      <div><label class="f">Cuota A · riesgo (U2.5)</label><input class="inp num" id="jCR" inputmode="decimal" value="${cR ?? ''}" placeholder="1.80"></div>
      <div><label class="f">Cuota B · protección (U3.5)</label><input class="inp num" id="jCP" inputmode="decimal" value="${cP ?? ''}" placeholder="1.30"></div>
    </div>
    <div id="jSplit"></div>

    <div class="sep"></div>
    <label class="f">¿Cómo terminó? <span class="oblig">· obligatorio</span></label>
    <div class="res tres" id="jRes">
      ${['ganan','prot','pierden'].map(r => `<button class="rbtn ${r} ${b.res===r?'on':''}" data-r="${r}">${RES_IC[r]}${RES_TXT[r]}<small>${RES_SUB[r]}</small></button>`).join('')}
    </div>
    <div class="grid2" style="margin-top:12px">
      <div><label class="f">Ingreso extra (mineros)</label><div class="pre"><input class="inp num" id="jExtra" inputmode="decimal" value="${b.extra ?? ''}" placeholder="0.00"></div></div>
      <div><label class="f">Fecha</label><input class="inp num" type="date" id="jFecha" value="${b.fecha || hoy}"></div>
    </div>
    <div class="hint">Lo que tus mineros u otros negocios meten hoy a la bolsa de apuestas. Si retiras plata, escríbelo en negativo (ej. -5).</div>
    <details style="margin-top:10px" ${typeof b.ganReal==='number'?'open':''}><summary>La casa me pagó distinto (ajustar ganancia real)</summary>
      <div class="pre" style="margin-top:8px"><input class="inp num sm" id="jReal" inputmode="decimal" value="${typeof b.ganReal==='number'?b.ganReal:''}" placeholder="Déjalo vacío para usar la calculada"></div>
    </details>
    <div id="jPrev" style="margin:14px 0 10px"></div>
    <button class="btn" id="jSave">Cerrar el día ${n+1}</button>
  </div>

  <div class="card">
    <h2>¿Pasó algo con el capital?</h2>
    <div class="grid2">
      <button class="btn dang sm" onclick="movModal('imp')">− Imprevisto</button>
      <button class="btn sec sm" onclick="movModal('apo')">+ Aporte extra</button>
    </div>
    <div class="hint">Imprevisto: te tocó sacar plata de la bolsa (salud, casa, familia…). Aporte: metes plata un día que no cerraste. Los dos cambian el stake de los días siguientes.</div>
    ${movsRecientes()}
  </div>

  <div class="card" onclick="ir('dis')" style="cursor:pointer">
    <div class="row">
      <div class="ring" style="width:56px;height:56px">${ringSVG(nHab/HABITOS.length, 56, 6)}<div class="in"><b style="font-size:15px">${nHab}/${HABITOS.length}</b></div></div>
      <div style="flex:1"><div style="font-weight:800">Disciplina de hoy</div><div class="muted" style="font-size:13px">${nHab===HABITOS.length?'Día completo. Así se construye.':'Aseo, orden, vestir, cuerpo, conocimiento, círculo… márcalos en Disciplina →'}</div></div>
    </div>
  </div>`;

  $('#hero').onclick = () => { S.msgOff = (S.msgOff||0) + 1; save(); renderHoy(); };
  const upd = () => updJugada();
  ['jCR','jCP','jExtra','jReal','jFecha'].forEach(id => $('#'+id).addEventListener('input', upd));
  $$('#jRes .rbtn').forEach(bt => bt.onclick = () => {
    const r = bt.dataset.r; S.borr.res = S.borr.res === r ? null : r;
    $$('#jRes .rbtn').forEach(x => x.classList.toggle('on', x.dataset.r === S.borr.res));
    updJugada();
  });
  $('#jSave').onclick = cerrarDia;
  updJugada();
}

function leerJugada(){
  const n = (id) => parseNum($('#'+id).value);
  const real = $('#jReal').value.trim() === '' ? null : n('jReal');
  return { cR: n('jCR'), cP: n('jCP'), extra: $('#jExtra').value.trim()==='' ? 0 : n('jExtra'), ganReal: real, fecha: $('#jFecha').value || hoyISO(), res: S.borr.res || null };
}
function updJugada(){
  const p = S.plan, C = capActual(), j = leerJugada();
  S.borr = { cR: isFinite(j.cR) ? j.cR : undefined, cP: isFinite(j.cP) ? j.cP : undefined, extra: $('#jExtra').value.trim()===''?undefined:j.extra, ganReal: (j.ganReal!==null && isFinite(j.ganReal)) ? j.ganReal : undefined, fecha: j.fecha, res: j.res };
  save();
  const stake = j.res === 'noaposte' ? 0 : r2(C * p.pct);
  $('#jStake').textContent = money(r2(C * p.pct));
  const sp = split(r2(C * p.pct), j.cR, j.cP);
  let h = '';
  if (!sp){
    h = `<div class="split">
      <div class="leg r vacia"><div class="caps"><span class="tag">A</span>Riesgo</div><b class="num">$ —</b></div>
      <div class="leg p vacia"><div class="caps"><span class="tag">B</span>Protección</div><b class="num">$ —</b></div>
    </div><div class="aviso info" style="margin-bottom:0"><div>Escribe las 2 cuotas (mayores que 1) y te digo cuánto va en la <b class="cyan">Apuesta A</b> y cuánto en la <b class="gold">Apuesta B</b>.</div></div>`;
  } else {
    const S0 = r2(C * p.pct);
    const gG = ganancia('ganan', S0, sp, j.cR, j.cP), gP = ganancia('prot', S0, sp, j.cR, j.cP);
    const k = kelly(p, j.cR, j.cP);
    let kv = '';
    if (k <= 0) kv = `<div class="aviso bad"><div><b class="t">Estas cuotas no tienen ventaja</b>Con las probabilidades de tu plan, esta combinación pierde a la larga. Mejor no jugarla.</div></div>`;
    else if (p.pct > k) kv = `<div class="aviso bad"><div><b class="t">Tu stake (${pct(p.pct)}) pasa el máximo de Kelly (${pct(k,1)})</b>Con estas cuotas es demasiado riesgo.</div></div>`;
    else if (p.pct > k/2) kv = `<div class="aviso warn"><div><b class="t">Cuidado</b>Con estas cuotas tu stake está por encima del prudente (medio Kelly: ${pct(k/2,1)}).</div></div>`;
    h = `<div class="aviso ok" style="margin:14px 0 0"><div>De tus <b class="gold">${money(S0)}</b> de hoy: <b class="cyan">${money(sp.r)} en la A</b> y <b class="gold">${money(sp.p)} en la B</b>.</div></div><div class="split">
      <div class="leg r"><div class="caps"><span class="tag">A</span>Riesgo</div><b class="num">${money(sp.r)}</b><div class="dim" style="font-size:12px">U2.5 @ ${fmt(j.cR)}</div><div class="cobra">Si gana, cobras <b class="num" style="display:inline;font-size:13px;color:var(--text)">${money(r2(sp.r*j.cR))}</b></div></div>
      <div class="leg p"><div class="caps"><span class="tag">B</span>Protección</div><b class="num">${money(sp.p)}</b><div class="dim" style="font-size:12px">U3.5 @ ${fmt(j.cP)}</div><div class="cobra">Si gana, cobras <b class="num" style="display:inline;font-size:13px;color:var(--text)">${money(r2(sp.p*j.cP))}</b> = recuperas los ${money(S0)}</div></div>
    </div>
    <div class="escen">
      <div class="row"><span>${RES_IC.ganan.replace('class="ic"','class="ic" style="width:16px;height:16px;color:var(--win)"')} Ganaron las 2</span><b class="num win">${money(r2(C+gG))} <span class="dim" style="font-weight:600">(${moneyS(gG)})</span></b></div>
      <div class="row"><span>${RES_IC.prot.replace('class="ic"','class="ic" style="width:16px;height:16px;color:var(--gold)"')} Ganó 1 (solo la B)</span><b class="num gold">${money(r2(C+gP))} <span class="dim" style="font-weight:600">(${moneyS(gP)})</span></b></div>
      <div class="row"><span>${RES_IC.pierden.replace('class="ic"','class="ic" style="width:16px;height:16px;color:var(--loss)"')} Perdieron las 2</span><b class="num loss">${money(r2(C-S0))} <span class="dim" style="font-weight:600">(${moneyS(-S0)})</span></b></div>
      <div class="dim" style="font-size:11.5px;margin-top:4px">Sin contar el ingreso extra.</div>
    </div>${kv}`;
  }
  $('#jSplit').innerHTML = h;

  // vista previa del cierre
  let prev = '', ok = false;
  if (!j.res) prev = `<div class="loss" style="font-size:13px;text-align:center;font-weight:700">Marca cómo terminó (ganaron las 2, ganó 1 o perdieron las 2) para cerrar el día.</div>`;
  else if (j.res !== 'noaposte' && !sp) prev = `<div class="dim" style="font-size:13px;text-align:center">Faltan las cuotas.</div>`;
  else if (!isFinite(j.extra)) prev = `<div class="loss" style="font-size:13px;text-align:center">El ingreso extra no es un número.</div>`;
  else if (j.ganReal !== null && !isFinite(j.ganReal)) prev = `<div class="loss" style="font-size:13px;text-align:center">La ganancia real no es un número.</div>`;
  else {
    ok = true;
    const g = j.ganReal !== null ? j.ganReal : ganancia(j.res, stake, sp, j.cR, j.cP);
    const fin = r2(C + g + j.extra), prox = r2(fin * p.pct);
    prev = `<div class="aviso info" style="margin:0"><div style="width:100%">
      <div class="kv"><span>Resultado apuestas</span><b class="num ${g>0?'win':g<0?'loss':''}">${moneyS(g)}</b></div>
      ${j.extra ? `<div class="kv"><span>Ingreso extra</span><b class="num cyan">${moneyS(j.extra)}</b></div>` : ''}
      <div class="kv"><span>Terminas el día con</span><b class="num" style="font-size:17px">${money(fin)}</b></div>
      <div class="kv"><span>Mañana apuestas (${pct(p.pct)})</span><b class="num gold">${money(prox)}</b></div></div></div>`;
  }
  $('#jPrev').innerHTML = prev;
  $('#jSave').disabled = !ok;
}

function cerrarDia(){
  const p = S.plan, j = leerJugada();
  const antes = capActual();
  const d = { id: Date.now().toString(36), fecha: j.fecha, pct: p.pct, cR: isFinite(j.cR)?j.cR:null, cP: isFinite(j.cP)?j.cP:null, res: j.res, extra: j.extra || 0, ganReal: j.ganReal };
  S.dias.push(d);
  recalc();
  S.borr = { cR: d.cR ?? undefined, cP: d.cP ?? undefined };
  save();
  const ult = S.dias[S.dias.length - 1];
  const hitosCruzados = HITOS.filter(h => recorrido(antes) < h.p && recorrido(ult.capFin) >= h.p);
  const pil = PILARES.find(x => x.id === 'apalancamiento');
  const col = {ganan:'win', prot:'gold', pierden:'loss', noaposte:'muted'}[ult.res];
  const ov = modal(`
    <div class="celebra">
      <div class="caps">Día ${ult.n} cerrado</div>
      <div style="margin:8px auto;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--card2)" class="${col}">${RES_IC[ult.res].replace('class="ic"','style="width:30px;height:30px"')}</div>
      <div class="big num">${money(ult.capFin)}</div>
      <div class="num ${ult.capFin-antes>=0?'win':'loss'}" style="font-weight:800">${moneyS(r2(ult.capFin-antes))} hoy</div>
      <p style="font-size:16px;font-weight:700;margin:14px 0 6px">${esc(pick(MSJ_RES[ult.res]))}</p>
      ${ult.extra > 0 ? `<p class="cyan" style="font-size:14px;margin:4px 0">Tus palancas sumaron ${money(ult.extra)}. ${esc(pick(pil.msj))}</p>` : ''}
      <div class="aviso info" style="text-align:left"><div>Mañana: <b class="gold">${money(r2(ult.capFin * p.pct))}</b> (${pct(p.pct)} de ${money(ult.capFin)}). El % no se negocia.</div></div>
      ${hitosCruzados.length ? `<div class="aviso ok" style="text-align:left"><div><b class="t">${hitosCruzados[hitosCruzados.length-1].t}</b>${hitosCruzados[hitosCruzados.length-1].m}</div></div>` : ''}
      <button class="btn" style="margin-top:12px" onclick="this.closest('.ov').remove()">Seguir con el plan</button>
    </div>`);
  if (ult.res === 'ganan' || hitosCruzados.length) confeti();
  render();
}


// ================= Barra de avance e imprevistos =================
function barraMeta(C){
  const p = S.plan, rec = recorrido(C), falta = r2(Math.max(0, p.meta - C)), n = S.dias.length;
  let pie;
  if (C >= p.meta) pie = '<b class="win">¡Meta alcanzada!</b>';
  else if (C < p.inicial) pie = `Estás <b class="loss">${money(r2(p.inicial - C))}</b> por debajo de donde empezaste. Te faltan <b style="color:var(--text)">${money(falta)}</b>.`;
  else pie = `Te faltan <b style="color:var(--text)">${money(falta)}</b> · tienes el ${pct(C / p.meta)} del monto meta · ${n} ${n === 1 ? 'día jugado' : 'días jugados'}`;
  return `<div class="mb">
    <div class="mb-head"><span class="caps">Avance a la meta</span><b class="num">${pct(rec)}</b></div>
    <div class="mb-track">${[25,50,75].map(t => `<i class="mb-tick" style="left:${t}%"></i>`).join('')}<div class="mb-fill" style="width:${rec*100}%"></div><div class="mb-dot" style="left:${Math.max(3, Math.min(97, rec*100))}%"></div></div>
    <div class="mb-lab"><span>Inicio ${money(p.inicial)}</span><span class="gold">🏁 ${money(p.meta)}</span></div>
    <div class="muted" style="font-size:13px;margin-top:8px">${pie}</div>
  </div>`;
}
function movsRecientes(){
  const ms = (S.movs || []).slice(-3).reverse();
  if (!ms.length) return '';
  return `<div class="sep"></div>` + ms.map(m => `<div class="kv" style="cursor:pointer" onclick="movModal(null,'${m.id}')"><span>${m.monto < 0 ? '<span class="loss">−</span> Imprevisto' : '<span class="cyan">+</span> Aporte'} · ${esc(m.motivo || '—')} <span class="dim">${fechaCorta(m.fecha)}</span></span><b class="num ${m.monto < 0 ? 'loss' : 'cyan'}">${moneyS(m.monto)}</b></div>`).join('');
}
function movModal(tipo, id){
  const m = id ? S.movs.find(x => x.id === id) : null;
  if (m) tipo = m.monto < 0 ? 'imp' : 'apo';
  const p = S.plan, C = capActual(), esImp = tipo === 'imp';
  let motivo = m ? m.motivo : '';
  modal(`
    <h3>${m ? 'Editar ' : ''}${esImp ? '<span class="loss">Imprevisto</span>' : '<span class="cyan">Aporte extra</span>'}</h3>
    <p class="muted" style="margin:0 0 12px;font-size:14px">${esImp ? 'Plata que tuviste que sacar de la bolsa de apuestas. Se resta del capital y el stake de los días siguientes se recalcula solo.' : 'Plata que metes a la bolsa fuera del cierre del día (mineros, negocio, ahorro). Se suma al capital.'}</p>
    <label class="f">Monto</label><div class="pre"><input class="inp num" id="mM" inputmode="decimal" value="${m ? Math.abs(m.monto) : ''}" placeholder="0.00"></div>
    <label class="f" style="margin-top:12px">Motivo</label>
    <div class="chips" id="mCh">${MOTIVOS[tipo].map(x => `<button class="chip ${motivo === x ? 'on' : ''}" data-m="${x}">${x}</button>`).join('')}</div>
    <input class="inp sm" id="mT" style="margin-top:8px" placeholder="Detalle (opcional)" value="${esc(m ? m.nota || '' : '')}">
    <label class="f" style="margin-top:12px">Fecha</label><input class="inp sm" type="date" id="mF" value="${m ? m.fecha : hoyISO()}">
    <div id="mPrev" style="margin-top:12px"></div>
    <div class="grid2" style="margin-top:14px">${m ? '<button class="btn dang sm" id="mDel">Borrar</button>' : '<button class="btn sec sm" id="mX">Cancelar</button>'}<button class="btn sm" id="mOk">Guardar</button></div>`, ov => {
    const base = m ? m.capAntes : C;
    const prev = () => {
      const v = parseNum($('#mM', ov).value);
      if (!(v > 0)) { $('#mPrev', ov).innerHTML = ''; return; }
      if (esImp && v > base) { $('#mPrev', ov).innerHTML = `<div class="aviso bad" style="margin:0"><div>No puede ser mayor que el capital que había (${money(base)}).</div></div>`; return; }
      const C2 = r2(base + (esImp ? -v : v));
      const e = extraProm(), mt = multTipico(p, p.pct, p.cR, p.cP);
      const d1 = simDias(base, p.meta, mt, e), d2 = simDias(C2, p.meta, mt, e);
      $('#mPrev', ov).innerHTML = `<div class="aviso ${esImp ? 'warn' : 'info'}" style="margin:0"><div style="width:100%">
        <div class="kv"><span>Capital</span><b class="num">${money(base)} → <span class="${esImp ? 'loss' : 'cyan'}">${money(C2)}</span></b></div>
        <div class="kv"><span>Stake siguiente (${pct(p.pct)})</span><b class="num">${money(r2(base*p.pct))} → ${money(r2(C2*p.pct))}</b></div>
        <div class="kv"><span>Días según el plan</span><b class="num">${d1 ?? '—'} → ${d2 ?? '—'}</b></div></div></div>`;
    };
    $('#mM', ov).addEventListener('input', prev); prev();
    $$('#mCh .chip', ov).forEach(c => c.onclick = () => { motivo = c.dataset.m; $$('#mCh .chip', ov).forEach(x => x.classList.toggle('on', x === c)); });
    if ($('#mX', ov)) $('#mX', ov).onclick = () => ov.remove();
    if ($('#mDel', ov)) $('#mDel', ov).onclick = () => {
      if (!confirm('¿Borrar este movimiento? El capital se recalcula.')) return;
      S.movs = S.movs.filter(x => x.id !== m.id); recalc(); save(); ov.remove(); toast('Movimiento borrado'); render();
    };
    $('#mOk', ov).onclick = () => {
      const v = parseNum($('#mM', ov).value);
      if (!(v > 0)) return toast('Escribe un monto mayor que 0');
      if (esImp && v > base) return toast('No puede ser mayor que el capital');
      if (!motivo) return toast('Elige un motivo');
      const datos = { monto: esImp ? -r2(v) : r2(v), motivo, nota: $('#mT', ov).value.trim(), fecha: $('#mF', ov).value || hoyISO() };
      if (m) Object.assign(m, datos);
      else S.movs.push(Object.assign({ id: 'm' + Date.now().toString(36), tras: S.dias.length ? S.dias[S.dias.length-1].id : null }, datos));
      recalc(); save(); ov.remove(); render();
      if (m) return toast('Movimiento corregido');
      const Cn = capActual();
      modal(`<div class="celebra">
        <div class="caps">${esImp ? 'Imprevisto registrado' : 'Aporte registrado'}</div>
        <div class="big num" style="margin:8px 0">${money(Cn)}</div>
        <div class="num ${esImp ? 'loss' : 'win'}" style="font-weight:800">${moneyS(datos.monto)} · ${esc(motivo)}</div>
        <p style="font-size:16px;font-weight:700;margin:14px 0 6px">${esc(esImp ? pick(MSJ_IMP) : pick(PILARES.find(x => x.id === 'apalancamiento').msj))}</p>
        <div class="aviso info" style="text-align:left"><div>Tu próxima apuesta: <b class="gold">${money(r2(Cn * p.pct))}</b> (${pct(p.pct)} de ${money(Cn)}).</div></div>
        <button class="btn" style="margin-top:12px" onclick="this.closest('.ov').remove()">Seguir con el plan</button></div>`);
    };
  });
}

// ================= REGISTRO =================
function chartSVG(){
  const p = S.plan, W = 360, H = 190, padL = 38, padR = 10, padT = 12, padB = 24;
  const reales = [p.inicial, ...S.dias.map(d => d.capTras ?? d.capFin)];
  const n = S.dias.length;
  const pr = proyeccion();
  const falta = pr.esp !== null ? Math.min(pr.esp, 120) : 0;
  const proj = [capActual()];
  for (let i = 0; i < falta; i++) proj.push(proj[proj.length-1] * pr.m + pr.e);
  const X = Math.max(n + falta, 5);
  const ymax = Math.max(p.meta * 1.08, ...reales, ...proj), ymin = Math.min(0, ...reales);
  const sx = i => padL + (W - padL - padR) * i / X, sy = v => padT + (H - padT - padB) * (1 - (v - ymin) / (ymax - ymin));
  const path = (arr, off=0) => arr.map((v, i) => (i ? 'L' : 'M') + sx(i + off).toFixed(1) + ' ' + sy(v).toFixed(1)).join(' ');
  const ticks = [0, p.meta/2, p.meta].map(v => `<line x1="${padL}" x2="${W-padR}" y1="${sy(v)}" y2="${sy(v)}" stroke="#22304f" stroke-dasharray="${v===p.meta?'0':'3 4'}"/><text x="${padL-6}" y="${sy(v)+4}" text-anchor="end" font-size="10" fill="#8e9bb8">$${Math.round(v)}</text>`).join('');
  const pts = reales.map((v, i) => `<circle cx="${sx(i).toFixed(1)}" cy="${sy(v).toFixed(1)}" r="${n>40?1.5:3}" fill="#f5b841"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
    ${ticks}
    <line x1="${padL}" x2="${W-padR}" y1="${sy(p.meta)}" y2="${sy(p.meta)}" stroke="#35d49a" stroke-width="1.5"/>
    <text x="${W-padR}" y="${sy(p.meta)-5}" text-anchor="end" font-size="10" font-weight="700" fill="#35d49a">META</text>
    ${falta ? `<path d="${path(proj, n)}" fill="none" stroke="#3fd0ff" stroke-width="2" stroke-dasharray="5 5" opacity=".8"/>` : ''}

  return n;
}

function renderPlan(){
  const p = S.plan, k = kelly(p, p.cR, p.cP), pE = Math.max(0, 1 - p.pG - p.pL);
  const n = S.dias.filter(d => d.res !== 'noaposte');

  const aR = avg('cR'), aP = avg('cP');
  let kMsg, kCls;
  if (k <= 0){ kMsg = 'Con esas cuotas y probabilidades la apuesta no tiene ventaja.'; kCls = 'bad'; }
  else if (p.pct > k){ kMsg = 'Tu stake pasa el máximo (Kelly): demasiado riesgo.'; kCls = 'bad'; }
  else if (p.pct > k/2){ kMsg = 'Cuidado: tu stake está por encima del prudente (medio Kelly).'; kCls = 'warn'; }
  else { kMsg = 'Tu stake está dentro de lo prudente.'; kCls = 'ok'; }
  const resp = S.ultResp ? new Date(S.ultResp).toLocaleString('es-VE',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : 'nunca';
  $('#v-plan').innerHTML = `

    <div class="kv"><span>Stake máximo prudente (medio Kelly)</span><b class="num gold">${pct(Math.max(0,k/2),1)}</b></div>

  const setNum = (id, key, f = x => x, ok = x => x > 0) => $('#'+id).addEventListener('change', e => {

// ================= Respaldo / Excel =================
function descargar(blob, nombre){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function respaldoBlob(){ return new Blob([JSON.stringify({app:'sinlimites', exportado:new Date().toISOString(), datos:S}, null, 1)], {type:'application/json'}); }
function exportJSON(){ descargar(respaldoBlob(), `sinlimites-respaldo-${hoyISO()}.json`); S.ultResp = Date.now(); save(); toast('Respaldo descargado ✓'); render(); }
async function compartirResp(){
  const f = new File([respaldoBlob()], `sinlimites-respaldo-${hoyISO()}.json`, {type:'application/json'});
  if (navigator.canShare && navigator.canShare({files:[f]})){
    try { await navigator.share({files:[f], title:'Respaldo Sin Límites'}); S.ultResp = Date.now(); save(); render(); } catch(e){}
  } else exportJSON();
}
$('#fileImp').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result); const d = j.datos || j;
      if (!d.plan || !Array.isArray(d.dias)) throw 0;
      if (!confirm(`Restaurar respaldo con ${d.dias.length} días (meta ${money(d.plan.meta)}). Reemplaza lo que hay en este teléfono. ¿Seguir?`)) return;
      S = Object.assign(blank(), d); recalc(); S.ultResp = Date.now(); save(); const wz = $('.wiz'); if (wz) wz.remove(); toast('Respaldo restaurado ✓'); ir('hoy');
    } catch(err){ toast('Ese archivo no es un respaldo válido'); }
    e.target.value = '';
  };
  rd.readAsText(f);
};

const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

function zipBytes(files){
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  for (const f of files){
    const nm = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, 0, true); lh.setUint16(12, 0x21, true); lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true);
    lh.setUint32(22, data.length, true); lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nm, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true); ch.setUint16(12, 0, true); ch.setUint16(14, 0x21, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, nm.length, true); ch.setUint32(42, off, true);
    central.push(new Uint8Array(ch.buffer), nm);
    off += 30 + nm.length + data.length;
  }
  const cds = central.reduce((a, b) => a + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cds, true); end.setUint32(16, off, true);
  const all = [...parts, ...central, new Uint8Array(end.buffer)];
  const out = new Uint8Array(all.reduce((a, b) => a + b.length, 0)); let p = 0; all.forEach(b => { out.set(b, p); p += b.length; });
  return out;
}
const colL = i => { let s = ''; i++; while (i){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
const xesc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function sheetXML(rows, widths){
  const cols = widths ? `<cols>${widths.map((w, i) => `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : '';
  const body = rows.map((r, ri) => `<row r="${ri+1}">${r.map((c, ci) => {
    if (c === null || c === undefined || c === '') return '';
    const ref = colL(ci) + (ri + 1), v = typeof c === 'object' ? c : { v: c }, s = v.s ? ` s="${v.s}"` : '';
    return typeof v.v === 'number' ? `<c r="${ref}"${s}><v>${v.v}</v></c>` : `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xesc(v.v)}</t></is></c>`;
  }).join('')}</row>`).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${cols}<sheetData>${body}</sheetData></worksheet>`;

  const files = [

// ================= Asistente inicial =================
function wizard(){
  const prev = $('.wiz'); if (prev) prev.remove();
  const t = { inicial: 30, meta: 100, pct: .25, cR: 1.8, cP: 1.3 };
  let paso = 0;
  const w = document.createElement('div'); w.className = 'wiz'; document.body.appendChild(w);
  const pasos = [
    () => `<div class="hero"><div class="art">${art('ciudad')}</div><div class="shade"></div></div>
      <h1>Sin pastilla.<br><span class="gold">Con método.</span></h1>
      <p>Esta es tu app personal para llevar el plan de capital con cobertura día a día, y para construir la disciplina que lo hace funcionar: enfoque, orden, aseo, apariencia, círculo, apalancamiento y conocimiento.</p>
      <p>Te voy a pedir 4 datos. Toma 30 segundos.</p>
      <p style="font-size:13px">¿Cambiaste de teléfono? <button class="lnk" onclick="$('#fileImp').click()">Restaurar un respaldo</button></p>`,
    () => `<div class="hero"><div class="art">${art('disciplina')}</div><div class="shade"></div></div>
      <h1>¿Con cuánto <span class="gold">empiezas</span>?</h1><p>El capital que hoy tienes en la bolsa de apuestas.</p>
      <div class="pre"><input class="inp num" id="wv" inputmode="decimal" value="${t.inicial}" style="font-size:28px"></div>`,
    () => `<div class="hero"><div class="art">${art('enfoque')}</div><div class="shade"></div></div>
      <h1>¿A qué monto <span class="gold">quieres llegar</span>?</h1><p>Tu meta. Una meta clara es la mitad del enfoque.</p>
      <div class="pre"><input class="inp num" id="wv" inputmode="decimal" value="${t.meta}" style="font-size:28px"></div>`,
    () => { const k = kelly({pG:.63,pL:.11}, t.cR, t.cP); return `<div class="hero"><div class="art">${art('apalancamiento')}</div><div class="shade"></div></div>
      <h1>Tu <span class="gold">stake diario</span></h1><p>El % de tu capital que vas a usar cada día. Día 1: ese % de ${money(t.inicial)}; día 2: ese % de lo que tengas al cerrar el día 1 (con ganancias y mineros), y así.</p>
      <div class="chips" id="wch">${[10,15,20,25,30].map(v => `<button class="chip ${Math.round(t.pct*100)===v?'on':''}" data-s="${v}">${v}%</button>`).join('')}</div>
      <div style="margin-top:12px"><label class="f">U otro %</label><input class="inp num" id="wv" inputmode="decimal" value="${Math.round(t.pct*100)}"></div>
      <div class="aviso info"><div>Día 1 apuestas <b class="gold" id="wd1">${money(r2(t.inicial*t.pct))}</b>. Con cuotas 1.80 / 1.30 el máximo prudente (medio Kelly) es ${pct(k/2,1)}.</div></div>`; },
    () => `<div class="hero"><div class="art">${art('periferica')}</div><div class="shade"></div></div>
      <h1>Tus <span class="gold">cuotas típicas</span></h1><p>Las usas para calcular cuántos días te faltan. Cada día igual vas a escribir las cuotas reales.</p>
      <div class="grid2"><div><label class="f">Cuota A · riesgo (U2.5)</label><input class="inp num" id="wr" inputmode="decimal" value="${t.cR}"></div>
      <div><label class="f">Cuota B · protección (U3.5)</label><input class="inp num" id="wp" inputmode="decimal" value="${t.cP}"></div></div>`,
  ];
  const leer = () => {
    if (paso === 1){ const v = parseNum($('#wv', w).value); if (!(v > 0)) return 'Escribe un monto mayor que 0'; t.inicial = v; }
    if (paso === 2){ const v = parseNum($('#wv', w).value); if (!(v > t.inicial)) return 'La meta tiene que ser mayor que el monto inicial'; t.meta = v; }
    if (paso === 3){ const v = parseNum($('#wv', w).value); if (!(v >= 1 && v <= 90)) return 'El stake debe estar entre 1% y 90%'; t.pct = v/100; }
    if (paso === 4){ const a = parseNum($('#wr', w).value), b = parseNum($('#wp', w).value); if (!(a > 1 && b > 1)) return 'Las cuotas deben ser mayores que 1'; t.cR = a; t.cP = b; }
    return null;
  };
  const pintar = () => {
    w.innerHTML = `<div class="wrap">${pasos[paso]()}
      <div class="dots">${pasos.map((_, i) => `<i class="${i===paso?'on':''}"></i>`).join('')}</div>
      <div class="grid2">${paso ? '<button class="btn sec" id="wb">Atrás</button>' : '<div></div>'}<button class="btn" id="wn">${paso === pasos.length-1 ? 'Empezar' : 'Siguiente'}</button></div></div>`;
    $('#wn', w).onclick = () => {
      const err = leer(); if (err) return toast(err);
      if (paso < pasos.length - 1){ paso++; pintar(); return; }
      S.plan = { inicial: t.inicial, meta: t.meta, pct: t.pct, cR: t.cR, cP: t.cP, pG: .63, pL: .11, piso: 0, inicio: hoyISO() };
      S.borr = { cR: t.cR, cP: t.cP };
      save(); w.remove(); vista = 'hoy'; ir('hoy');
      modal(`<div class="celebra"><div class="caps">Plan creado</div><div class="big num" style="margin:8px 0">${money(t.inicial)} → <span class="gold">${money(t.meta)}</span></div>
        <p style="font-weight:700">Día 1: apuestas ${money(r2(t.inicial*t.pct))} (${pct(t.pct)}).</p>
        <p class="muted">Escribe las cuotas del día, mira cuánto va a cada apuesta y, cuando termine el partido, cierra el día. La app hace el resto.</p>
        <button class="btn" onclick="this.closest('.ov').remove()">Vamos</button></div>`);
    };
    if ($('#wb', w)) $('#wb', w).onclick = () => { leer(); paso--; pintar(); };
    const wv = $('#wv', w);
    if (paso === 3){
      $$('#wch .chip', w).forEach(c => c.onclick = () => { wv.value = c.dataset.s; wv.dispatchEvent(new Event('input')); });
      wv.oninput = () => { const v = parseNum(wv.value); $$('#wch .chip', w).forEach(c => c.classList.toggle('on', Number(c.dataset.s) === v)); if (v > 0) $('#wd1', w).textContent = money(r2(t.inicial * v / 100)); };
    }
    const first = $('input', w); if (first) setTimeout(() => first.focus(), 350);
  };
  pintar();
}

// ================= Arranque =================
if (S.plan) recalc();
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
